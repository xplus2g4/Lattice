<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <title>Lattice — Understand your course. Not just the answer.</title>
  <desc>A course workspace for reading Materials, asking with Citations and keeping private Notes. Private beta, Invite required.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#C9DAD6" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <path fill="#0E2622" d="M0 0h1200v630H0z"/>
  <path fill="url(#grid)" d="M744 0h456v630H744z"/>
  <path stroke="#5CD1BE" stroke-opacity=".18" d="M744 0v630"/>
  <g transform="translate(72 62)">
    <rect width="56" height="56" rx="6" fill="#16362F"/>
    <path d="M20 14v28M36 42V14M14 20h28M42 36H14" stroke="#5CD1BE" stroke-width="3.2" stroke-linecap="square"/>
  </g>
  <text x="145" y="102" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="39" font-weight="600" letter-spacing="-1.8">Lattice<tspan fill="#5CD1BE">.</tspan></text>
  <rect x="857" y="74" width="271" height="35" rx="2" stroke="#5CD1BE" stroke-opacity=".4"/>
  <text x="992" y="96" text-anchor="middle" fill="#C9DAD6" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.5">PRIVATE BETA · INVITE REQUIRED</text>
  <text x="72" y="185" fill="#5CD1BE" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.5">YOUR COURSE. A LITTLE CLEARER.</text>
  <g font-family="Georgia, serif" font-size="76" letter-spacing="-2.5" fill="#FFFFFF">
    <text x="68" y="269">Understand</text>
    <text x="68" y="353">your course.</text>
  </g>
  <text x="72" y="425" fill="#C9DAD6" font-family="Georgia, serif" font-size="49" font-style="italic" letter-spacing="-1.5">Not just the answer.</text>
  <text x="72" y="486" fill="#C9DAD6" font-family="Arial, sans-serif" font-size="21">Read, ask and practise in one course workspace.</text>
  <path d="M72 539h590" stroke="#C9DAD6" stroke-opacity=".2"/>
  <text x="72" y="575" fill="#8FA7A2" font-family="Arial, sans-serif" font-size="14">Course Materials</text>
  <text x="267" y="575" fill="#8FA7A2" font-family="Arial, sans-serif" font-size="14">Private Notes</text>
  <text x="439" y="575" fill="#8FA7A2" font-family="Arial, sans-serif" font-size="14">Answers with Citations</text>
  <g transform="translate(798 173)">
    <rect x="8" y="10" width="330" height="351" rx="5" fill="#071A17" fill-opacity=".6"/>
    <rect width="330" height="351" rx="5" fill="#F6F8F7"/>
    <path d="M0 48h330" stroke="#DDE5E2"/>
    <text x="24" y="30" fill="#58716B" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">A LITTLE MORE UNDERSTANDING</text>
    <text x="24" y="87" fill="#0E2622" font-family="Georgia, serif" font-size="25">One question.</text>
    <text x="24" y="117" fill="#0E2622" font-family="Georgia, serif" font-size="25">Something clicks.</text>
    <rect x="24" y="144" width="282" height="72" rx="3" fill="#E3F0EB"/>
    <text x="39" y="174" fill="#0E2622" font-family="Arial, sans-serif" font-size="14">Why is a small cache useful?</text>
    <text x="39" y="198" fill="#58716B" font-family="Arial, sans-serif" font-size="12">Ask about what you’re reading.</text>
    <path d="M24 244h282" stroke="#DDE5E2"/>
    <text x="24" y="269" fill="#0F7F6E" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">FOLLOW THE CITATIONS</text>
    <rect x="24" y="285" width="282" height="39" rx="3" fill="#E3F0EB" stroke="#CADDD5"/>
    <text x="37" y="310" fill="#0E2622" font-family="Arial, sans-serif" font-size="14">Memory &amp; caching</text>
    <text x="270" y="310" text-anchor="end" fill="#0F7F6E" font-family="Arial, sans-serif" font-size="12">p. 12</text>
  </g>
  <text x="963" y="562" text-anchor="middle" fill="#8FA7A2" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">ILLUSTRATIVE UI · SAMPLE CONTENT</text>
</svg>
