name: Marketing site

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-pages.yml"
  pull_request:
    paths:
      - "marketing/**"
      - ".github/workflows/marketing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.MARKETING_SITE_URL || 'https://xplus2g4.github.io/Lattice/' }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy marketing site
        id: deployment
        uses: actions/deploy-pages@v4
