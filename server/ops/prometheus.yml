global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lattice-api
    metrics_path: /metrics
    # The same METRICS_TOKEN the API checks, mounted by compose as a secret.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
