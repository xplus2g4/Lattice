[project]
name = "lattice"
version = "0.0.0"
description = "Course knowledge store backend: API and Worker."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "cognee[fastembed]==1.5.4",
    "fastapi",
    "filelock==3.32.6",
    "httpx",
    "mcp==1.30.0",
    "pgvector>=0.5.0",
    "pydantic-settings",
    "pyjwt>=2.13.0",
    "pypdf==6.18.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn",
]

[tool.uv]
exclude-newer = "2026-09-14T16:00:00Z"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lattice"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
